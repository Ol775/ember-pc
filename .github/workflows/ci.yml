name: CI

# Builds everything and runs every test on each push and pull request. Nothing here publishes a release.
on:
  push:
    branches: [main, phase1, phase2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Ember.sln -c Release --nologo
      - name: Test
        run: dotnet test Ember.sln -c Release --no-build --nologo --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
